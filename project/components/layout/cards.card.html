<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: 24px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, Badge, Tag, StatCard } = window.HoneyBeeSystemsDesignSystem_48ceb3;
  const Srv = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="7" rx="2" stroke="currentColor" strokeWidth="2"/><rect x="3" y="13" width="18" height="7" rx="2" stroke="currentColor" strokeWidth="2"/></svg>;
  function Demo() {
    return (
      <div>
        <div className="row">
          <Badge tone="success" dot>Online</Badge>
          <Badge tone="danger" dot>Down</Badge>
          <Badge tone="warning">SLA at risk</Badge>
          <Badge tone="honey" variant="solid">Priority</Badge>
          <Badge tone="info">Scheduled</Badge>
          <Badge tone="neutral">Draft</Badge>
        </div>
        <div className="row">
          <Tag selected>Servers</Tag>
          <Tag>Workstations</Tag>
          <Tag onRemove={()=>{}}>Windows 11</Tag>
        </div>
        <div className="grid">
          <StatCard label="Devices online" value="248" delta="4 new" deltaDirection="up" icon={<Srv/>} />
          <StatCard label="Open tickets" value="12" unit="active" />
          <StatCard label="Uptime" value="99.98" unit="%" variant="honey" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
