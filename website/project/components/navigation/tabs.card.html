<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: 24px; }
  .panel { padding: 20px 2px; color: var(--text-body); font-weight: var(--fw-medium); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Tabs } = window.HoneyBeeSystemsDesignSystem_48ceb3;
  const items = [
    { value: 'open', label: 'Open tickets', badge: 12 },
    { value: 'progress', label: 'In progress', badge: 5 },
    { value: 'resolved', label: 'Resolved' },
    { value: 'devices', label: 'Devices' },
  ];
  function Demo() {
    const [tab, setTab] = React.useState('open');
    const copy = {
      open: 'Showing 12 tickets awaiting a technician.',
      progress: '5 tickets currently being worked.',
      resolved: 'Resolved this week — 41 tickets closed.',
      devices: '248 managed endpoints across 6 sites.',
    };
    return (
      <div>
        <Tabs items={items} value={tab} onChange={setTab} />
        <div className="panel">{copy[tab]}</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
